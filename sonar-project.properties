# Konfigurasi SonarQube — STOKITA
# Dijalankan dengan: npm run sonar (lihat package.json)

# Server SonarQube Community lokal (bukan SonarQube Cloud)
sonar.host.url=http://localhost:9000

sonar.projectKey=stokita
sonar.projectName=STOKITA

# Sumber TypeScript/TSX yang dianalisis (test & artefak dikecualikan)
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/test-utils/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test-utils/**

# Bahasa & lingkungan
sonar.sourceEncoding=UTF-8
sonar.javascript.node.max.space=4096

# Coverage dari Vitest (hasil `npm test -- --coverage`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Kualitas proyek (penilaian Reliability/Maintainability/Security)
sonar.qualitygate.wait=false
