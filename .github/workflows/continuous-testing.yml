name: Continuous Testing

# Berjalan otomatis setiap ada push ke main atau pull request dibuka/diupdate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint · Typecheck · Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Unit test + coverage (Vitest)
        run: npm run test:coverage

      - name: Unggah laporan coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
